<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="Page icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <title>For my love</title>
</head>
<body>
  <header></header>
  <main>
    <h1 class="login">LOGIN</h1>
    
    <div class="line"></div>

    <form>
      <div class="login-field">
        <label for="date">Data de namoro:</label>
        <input autocomplete="off" type="date" name="date" id="date">
        <p class="error_message">mensagem de erro</p>
      </div>

      <div class="login-field">
        <label for="secret_word">Palavra que nós "caga" de rir:</label>
        <input autocomplete="off" type="text" name="secret_word" id="secret_word">
        <p class="error_message">mensagem de erro</p>
      </div>

      <div class="login-field">
        <label for="what_am_i">Sou sua:</label>
        <input autocomplete="off" type="text" name="what_am_i" id="what_am_i">
        <p class="error_message">mensagem de erro</p>
      </div>

      <div class="login-field">
        <label for="rafaels_surname">Apelido do Rafael:</label>
        <input autocomplete="off" type="text" name="rafaels_surname" id="rafaels_surname">
        <p class="error_message">mensagem de erro</p>
      </div>

      <button type="submit" class="submit">Entrar</button>
    </form>
  </main>
  <footer></footer>
  <script src="login.js"></script>
</body>
</html>
